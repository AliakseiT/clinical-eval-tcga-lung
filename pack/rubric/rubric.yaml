items:
  - id: item_diagnosis
    statement: The brief states the histological diagnosis (lung adenocarcinoma).
    type: binary
    critical: true
    target: output
    evidence_required: true
    grading_instructions: >
      Score 1.0 if the output states the histological diagnosis supported by the
      pathology report; else 0.0. Missing the diagnosis is a critical omission.
    max_score: 1.0
  - id: item_staging
    statement: The brief provides the clinical/pathologic stage.
    type: binary
    critical: false
    target: output
    evidence_required: true
    grading_instructions: >
      Score 1.0 if the output states the AJCC stage supported by the clinical
      summary; else 0.0.
    max_score: 1.0
  - id: item_molecular
    statement: The brief reports the actionable molecular alteration.
    type: binary
    critical: false
    target: output
    evidence_required: true
    grading_instructions: >
      Score 1.0 if the output names the molecular alteration from the molecular
      report; else 0.0. (Molecular data is enrichment; where absent, this item is
      left for physician adjudication.)
    max_score: 1.0
