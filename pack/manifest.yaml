id: tcga-lung
version: "0.1.0"
intended_use: >
  Demonstration pack: summarize a lung-adenocarcinoma record for a molecular tumor
  board, stating the histological diagnosis, clinical stage, and (where available)
  the actionable molecular alteration. Built on REAL, de-identified, public
  TCGA-LUAD data. FOR DEMONSTRATION / DISCUSSION WITH CLINICIANS — not a clinical
  device.
device_status_rationale: >
  Demonstration configuration on public de-identified research data (TCGA). Not
  placed on the market or put into service for a clinical purpose.
population: >
  Public de-identified TCGA lung adenocarcinoma (LUAD) cases; English (pathology
  reports were generated at a variety of institutions, some machine-translated).
languages: ["en"]
