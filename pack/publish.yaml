slug: tumor-board
title: Oncology tumor board preparation
export_name: tumorBoard
report_title: Validation dossier — tumor board preparation (tcga-lung pack)

summary: >-
  An AI drafts the case summary a lung-cancer tumor board works from. This
  pipeline checks whether the draft survives missing documents, model swaps,
  and de-identification — on real, de-identified TCGA lung cases.

data_note: >-
  Cases are real, de-identified pathology and clinical records of lung-cancer
  patients from The Cancer Genome Atlas (TCGA), sourced from the NCI GDC open
  tier and cBioPortal (ODbL, with attribution). No DearAuditor client data is
  involved.

diffs:
  swap:
    baseline: a36a296da0c5f9a2 # gemini-2.5-flash, gemini_compare battery
    candidate: ec09ac6c7cfc2f4e # gemini-3.5-flash, same pinned inputs

fact_files:
  deid: ../records/verification_validation/deid-recall-evaluation.json

arc:
  task: |
    <p>Before a tumor board meets, someone has to condense each patient's chart — pathology report, clinical summary, molecular findings — into the brief the board actually discusses. It is exactly the kind of drafting work clinics now hand to an AI model.</p>
    <p>The workflow under test: the model reads the case documents and produces a structured summary with diagnosis, stage, and the findings that drive treatment options.</p>

  risks: |
    <p>The dangerous failure is not a wrong answer — it is a <strong>confident answer built on missing evidence</strong>. If the pathology report never made it into the prompt (a broken upload, a permissions gap, a truncated context), a good model should say so. A bad one fills the gap with plausible text.</p>
    <ul>
    <li><strong>Confabulation under missing inputs</strong> — the summary states a diagnosis and stage no source document supports.</li>
    <li><strong>Silent drift on model updates</strong> — the vendor swaps the underlying model and yesterday's validated behavior quietly changes.</li>
    <li><strong>De-identification gaps</strong> — patient identifiers slip through the pipeline into prompts and logs.</li>
    </ul>

  measurement: |
    <p>The pipeline runs every case through a <strong>perturbation grid</strong>: the same case with individual documents withheld, reordered, or degraded. A pinned AI judge scores each output against a rubric, and the difference tells us how much each document actually contributes — its <strong>information value</strong>. A document the model can lose without its score dropping is a document the model is not really using.</p>
    <p>The same pinned setup re-runs whenever a model changes, so a swap becomes a measured regression check instead of a hope.</p>

  findings: |
    <p>We ran the same pinned contract battery on two Gemini generations. The headline: <strong>how much a model leans on the pathology report depends on the model version</strong> — which is exactly why the measurement has to be repeated on every swap.</p>
    <div class="table-wrap"><table class="data-table">
    <thead><tr><th>Input document</th><th>{{run.aa75fb2beedbe46e.sut}}</th><th>{{run.9d1cfd7827de6129.sut}}</th><th>Reading</th></tr></thead>
    <tbody>
    <tr><td><strong>pathology_report</strong></td><td>{{run.aa75fb2beedbe46e.element.pathology_report.information_value|.2f}}</td><td>{{run.9d1cfd7827de6129.element.pathology_report.information_value|.2f}}</td><td>On {{run.9d1cfd7827de6129.sut}}, scores did not drop at all when the report was withheld — the model still produced the histological diagnosis, which only that report supports. The older model used it only slightly more.</td></tr>
    <tr><td><strong>clinical_summary</strong></td><td>{{run.aa75fb2beedbe46e.element.clinical_summary.information_value|.2f}}</td><td>{{run.9d1cfd7827de6129.element.clinical_summary.information_value|.2f}}</td><td>Barely used, by either model.</td></tr>
    <tr><td><strong>molecular_report</strong></td><td>{{run.aa75fb2beedbe46e.element.molecular_report.information_value|.2f}}</td><td>{{run.9d1cfd7827de6129.element.molecular_report.information_value|.2f}}</td><td>The only input both models measurably rely on.</td></tr>
    </tbody>
    </table></div>
    <p><strong>Model-swap regression:</strong> re-running the pinned comparison battery, {{diff.swap.baseline_sut}} &rarr; {{diff.swap.candidate_sut}} showed a mean score delta of {{diff.swap.delta|.2f}} ({{diff.swap.n_regressions}} case-level regressions) — the gate PASSED. That is the point: the swap was verified, not assumed.</p>
    <p class="caveat"><strong>How much weight these numbers carry:</strong> this case bank holds 8 cases. That is enough to demonstrate the method and to catch a gross failure, and far too few to certify a model — an information value of 0.08 versus 0.00 is a difference of two graded checks, well inside the noise a bank this size produces. A clinic engagement runs the same pipeline on hundreds of local cases, where the confidence intervals actually close. Read these figures as a worked demonstration, not as a verdict on either model.</p>
    <p><strong>De-identification check:</strong> adding clinical recognizers to the ingest pipeline raised measured identifier recall from {{file.deid.baseline.overall_recall|.0%}} to {{file.deid.with_clinical.overall_recall|.0%}} on synthetic identifiers injected into the case bank. {{file.deid.with_clinical.overall_recall|.0%}} here is an upper bound — recall is only measurable against identifiers we know are there, so it demonstrates the fix, not the absence of all leaks.</p>

  meaning: |
    <p>If your tumor-board assistant scores like this, the summary it hands your board can read perfectly while resting on nothing — and whether that happens can change with a routine model update, as it did between these two versions. The fix is not a better prompt — it is a <strong>contract</strong>: the workflow must refuse to summarize when a required document is absent, and your validation pipeline must prove it refuses.</p>
    <p>That proof is repeatable. When the vendor ships a new model version, the same pinned pack re-runs in minutes and tells you whether the contract still holds — for that version, not the last one.</p>
